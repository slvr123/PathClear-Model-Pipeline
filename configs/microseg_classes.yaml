# MicroSeg 5-class taxonomy for ESP32-CAM lightweight segmentation.
# Documentation mirror of microseg_taxonomy.py — not a training configuration.
# IDs are zero-based model output channel indices.

schema_version: 2
source_of_truth: microseg_taxonomy.py
target_hardware: ESP32-CAM (AI-Thinker), Xtensa LX6 240 MHz
input_resolution: "96x96"
ignore_label: 255

classes:
  - id: 0
    name: Background
    color_rgb: [64, 64, 64]
    description: >
      Ambient scene content not relevant to path navigation: sky, building facades,
      vegetation, people, vehicles. Learned primarily from local Philippine street data.
      Most Cityscapes pixels in this semantic range are mapped to Ignore (255) rather
      than Background to avoid conflating unrelated scene context with true background.
    cityscapes_train_ids: []
    kaggle_crosswalk_ids: []

  - id: 1
    name: Walkable
    color_rgb: [144, 238, 144]
    description: >
      Recognizable pedestrian surface: sidewalks, paved footpaths, curb ramps.
      Maps from Cityscapes sidewalk (trainId 1). Fine-tuned with local Philippine
      sidewalk footage. Does not imply the surface is obstacle-free.
    cityscapes_train_ids: [1]
    kaggle_crosswalk_ids: []

  - id: 2
    name: Non-walkable
    color_rgb: [220, 50, 50]
    description: >
      Vehicle roadway. Mapped from Cityscapes road (trainId 0).
      Triggers the road-drift haptic alert (left temple buzz) in firmware.
    cityscapes_train_ids: [0]
    kaggle_crosswalk_ids: []

  - id: 3
    name: Boundary
    color_rgb: [255, 165, 0]
    description: >
      Lateral navigation anchors: walls, fences, gates, railings.
      Mapped from Cityscapes wall (3) and fence (4). Drives tactile
      shorelining feedback (right temple pulse) in firmware.
    cityscapes_train_ids: [3, 4]
    kaggle_crosswalk_ids: []

  - id: 4
    name: Crosswalk
    color_rgb: [100, 149, 237]
    description: >
      Zebra-stripe pedestrian crossing paint. Has NO Cityscapes source pixels.
      Trained from FPVCrosswalk2025 (Kaggle, CC0) and local Philippine street
      annotations. Triggers soft double-chime audio
      feedback in firmware.
    cityscapes_train_ids: []
    kaggle_crosswalk_mask_threshold_gt: 127
    kaggle_crosswalk_note: >
      Kaggle masks are binary images. Pixels > 127 are treated as Crosswalk (4);
      pixels <= 127 are Ignore (255), so only crosswalk pixels supervise class 4.

data_sources:
  cityscapes:
    description: "Cityscapes *_labelTrainIds.png masks, split train/val"
    classes_covered: [1, 2, 3]
  kaggle_fpv_crosswalk:
    description: "FPVCrosswalk2025, 300 real + 3,000 synthetic FPV images and binary masks"
    license: "CC0: Public Domain"
    classes_covered: [4]
  local_philippine:
    description: "PathClear local pilot — annotated Philippine street footage"
    classes_covered: [0, 1, 2, 3, 4]
    status: "planned — not yet collected"
